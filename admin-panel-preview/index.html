<!DOCTYPE html>
<html lang="tr" data-theme="dark" data-density="comfortable" data-radius="soft">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PDKS — Admin Paneli</title>

  <!-- Tipografi: Manrope (varsayılan) + Inter + Plus Jakarta Sans (Tweaks ile seçilebilir) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/admin.css?v=12" />
  <!-- Lucide ikonları — MIT lisanslı, ücretsiz (https://lucide.dev) -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

  <!-- ============================================================
       TWEAKS — varsayılan değerler (host bu bloğu diske yazar)
       ============================================================ -->
  <script>
    window.TWEAKS = /*EDITMODE-BEGIN*/{
      "theme": "light",
      "accent": "#f97316",
      "density": "compact",
      "radius": "sharp",
      "font": "Manrope",
      "sidebar": "collapsed",
      "motion": "full"
    }/*EDITMODE-END*/;
  </script>
</head>
<body>
  <div class="admin-shell" id="admin-shell" data-sidebar="expanded">
    <!-- Mobilde sidebar açıkken arkayı karartan katman -->
    <div class="sidebar-overlay" id="sidebar-overlay" onclick="closeSidebar()"></div>

    <!-- ============ SIDEBAR ============ -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-logo">
        <div class="logo-mark">P</div>
        <div class="logo-text">
          <strong>PDKS Admin</strong>
          <span>Acme Yazılım A.Ş.</span>
        </div>
      </div>

      <nav class="sidebar-nav" id="sidebar-nav">
        <!-- JS ile moduleRegistry'den otomatik üretilir -->
      </nav>

      <div class="sidebar-footer">
        <div class="user-card">
          <div class="avatar">BÖ</div>
          <div class="user-info">
            <strong>Berkay Ölçer</strong>
            <span>Tam Yetkili Admin</span>
          </div>
          <span class="user-caret"><i data-lucide="chevrons-up-down" class="icon icon-sm"></i></span>
        </div>
      </div>
    </aside>

    <!-- ============ MAIN ============ -->
    <div>
      <header class="topbar">
        <div class="topbar-left">
          <button class="btn btn-ghost icon-btn sidebar-toggle" onclick="toggleSidebar()" aria-label="Menüyü aç/kapat">
            <i data-lucide="menu" class="icon"></i>
          </button>
          <button class="topbar-icon rail-toggle" onclick="toggleRail()" aria-label="Kenar çubuğunu daralt/genişlet" title="Kenar çubuğunu daralt/genişlet">
            <i data-lucide="panel-left-close" class="icon" id="rail-icon"></i>
          </button>
          <div>
            <h1 id="page-title">Genel Bakış</h1>
            <div class="topbar-sub" id="page-sub">Şirketinizin günlük özeti</div>
          </div>
        </div>

        <div class="topbar-search">
          <span class="search-ico"><i data-lucide="search" class="icon icon-sm"></i></span>
          <input type="text" placeholder="Personel, kayıt veya sayfa ara…" aria-label="Ara" />
          <span class="search-kbd">⌘K</span>
        </div>

        <div class="topbar-actions">
          <button class="topbar-icon" id="notif-bell-btn" aria-label="Bildirimler" title="Bildirimler" onclick="toggleNotifPanel(event)">
            <i data-lucide="bell" class="icon"></i>
            <span class="dot" id="notif-dot" style="display:none"></span>
          </button>
          <button class="topbar-icon" aria-label="Çıkış Yap" title="Çıkış Yap">
            <i data-lucide="log-out" class="icon"></i>
          </button>
        </div>
      </header>

      <main class="content page-enter" id="content">
        <!-- JS ile sayfa içeriği basılır -->
      </main>
    </div>
  </div>

  <!-- ============ MODAL (Genel Bakış stat kartları) ============ -->
  <div class="modal-overlay" id="modal-overlay" onclick="closeModalOnOverlay(event)">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modal-title"></h3>
        <button class="btn btn-ghost icon-btn" onclick="closeModal()" aria-label="Kapat">
          <i data-lucide="x" class="icon"></i>
        </button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <!-- ============ TWEAKS PANELİ ============ -->
  <aside class="tweaks-panel" id="tweaks-panel" aria-label="Tweaks">
    <div class="tweaks-head">
      <strong><i data-lucide="sliders-horizontal" class="icon icon-sm"></i> Tweaks</strong>
      <button class="tweaks-close" onclick="closeTweaks()" aria-label="Kapat"><i data-lucide="x" class="icon icon-sm"></i></button>
    </div>
    <div class="tweaks-body" id="tweaks-body"><!-- JS ile üretilir --></div>
  </aside>

  <script src="js/admin.js?v=8"></script>
  <script src="js/tweaks.js?v=8"></script>
</body>
</html>
